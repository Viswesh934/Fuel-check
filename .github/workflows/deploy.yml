name: Deploy Fuel Check to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'routes/**'
      - 'config/**'
      - 'Dockerfile'
      - 'Dockerfile.lambda'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: 'deploy-ci-secret-key-for-test-suite'
        run: python manage.py test --verbosity=2

  deploy:
    name: Build & Deploy Lambda Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::136172187126:role/OIDC' }}
          aws-region: ap-south-1
          role-session-name: GitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'fuel-check-copilot' }}
          IMAGE_TAG: ${{ github.sha }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        run: |
          # Create ECR repository if it does not exist
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" > /dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY"

          # Build container image from Dockerfile.lambda (Lambda requires provenance=false)
          docker build --platform linux/amd64 --provenance=false -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile.lambda .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Push both commit SHA tag and latest tag
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to AWS Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'fuel-check-copilot' }}
          IMAGE_TAG: ${{ github.sha }}
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME || 'fuel-check-copilot' }}
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" > /dev/null 2>&1; then
            echo "Updating Lambda function: $LAMBDA_FUNCTION_NAME with image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Waiting for function update to stabilize..."
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
          else
            echo "::warning::Lambda function '$LAMBDA_FUNCTION_NAME' not found in ap-south-1. Container image has been pushed to $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG. Create the function in the AWS Console using this container image or via deploy script."
          fi

      - name: Optional Health Check
        if: ${{ env.LAMBDA_FUNCTION_URL != '' }}
        env:
          LAMBDA_FUNCTION_URL: ${{ secrets.LAMBDA_FUNCTION_URL }}
        run: |
          echo "Pinging Lambda Function URL health check..."
          curl -fsS "${LAMBDA_FUNCTION_URL%/}/api/health/" || curl -fsS -X POST "$LAMBDA_FUNCTION_URL" -H "Content-Type: application/json" -d '{"action": "health"}'
